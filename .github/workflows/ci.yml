name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
      - name: 清单与知识库校验
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle) throw new Error('missing dsh.bundle'); console.log('manifest ok', p.name, p.version)"
          node -e "const k=require('./knowledge.json'); if(!Array.isArray(k.items)||k.items.length===0) throw new Error('knowledge.json empty'); console.log('knowledge ok', k.items.length)"